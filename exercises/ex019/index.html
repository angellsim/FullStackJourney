<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  .menu {
      display: flex;
      list-style: none;
      background-color: #333;
      padding: 0;
      margin: 0;
  }

  .menu li a {
      display: block;
      color: white;
      padding: 15px 20px;
      text-decoration: none;
      text-align: center;
  }

  .menu li a:hover {
      background-color: #555;
  }

  @media (max-width: 600px) {
      .menu {
          flex-direction: column;
      }
  }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Produtos</a></li>
        <li><a href="#">Serviços</a></li>
        <li><a href="#">Contato</a></li>
    </ul>
  </nav>
</body>
</html>
