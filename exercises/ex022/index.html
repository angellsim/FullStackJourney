<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }

  :root {
      font-size: 16px; 
  }

  body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      overflow-x: hidden; 
  }

  .topo-site {
      background: #222;
      color: white;
      padding: 2rem;
      text-align: center;
  }

  .menu-adaptavel {
      display: flex;
      justify-content: center;
      list-style: none;
      margin-top: 1rem;
      gap: 20px;
  }

  .menu-adaptavel a {
      color: white;
      text-decoration: none;
      font-weight: bold;
  }

  .container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
  }

  .galeria {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
  }

  .item {
      flex: 1 1 calc(25% - 20px); 
      min-width: 250px; 
  }

  .item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      transition: transform 0.3s;
  }

  .item img:hover {
      transform: scale(1.03);
  }

  @media (max-width: 992px) {
      :root { font-size: 15px; }
      
      .item {
          flex: 1 1 calc(50% - 20px);
      }
  }

  @media (max-width: 600px) {
      :root { font-size: 14px; }

      .menu-adaptavel {
          flex-direction: column;
          gap: 10px;
      }

      .item {
          flex: 1 1 100%;
      }

      .topo-site h1 {
          font-size: 1.8rem;
      }
  }
  </style>
</head>
<body>
  <header class="topo-site">
    <h1>Meu Portfólio</h1>
    <nav>
        <ul class="menu-adaptavel">
            <li><a href="#">Início</a></li>
            <li><a href="#">Galeria</a></li>
            <li><a href="#">Sobre</a></li>
        </ul>
    </nav>
  </header>

  <main class="container">
      <section class="galeria">
          <div class="item"><img src="#" alt="Work 1"></div>
          <div class="item"><img src="#" alt="Work 2"></div>
          <div class="item"><img src="#" alt="Work 3"></div>
          <div class="item"><img src="#" alt="Work 4"></div>
      </section>
  </main>

  <footer class="rodape">
      <p>&copy; 2026 - Design Adaptativo</p>
  </footer>
</body>
</html>
