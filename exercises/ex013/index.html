<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 caixas</title>
  <style>
    .caixa {
      display: grid;
      grid-auto-flow: column;
      margin: 40px;
      justify-content: space-around;
    }

    .caixa div {
      background: red;
      padding: 20px 40px;
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <div class="caixa">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>
  </main>
</body>
</html>
