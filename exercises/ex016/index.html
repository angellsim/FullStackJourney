<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Full</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: 80px 1fr;
      height: 100vh;
    }

    .topo {
      grid-column: 1/3;
    }

    .footer {
      grid-column: 1 / 3;
    }





  </style>
</head>
<body>

  <div class="container">

    <header class="topo">
      Topo da página
    </header>

    <aside class="menu">
      Sidebar
    </aside>
    
    <main class="conteudo">
      Conteúdo principal
    </main>

    <footer class="rodape">
      Rodapé
    </footer>

  </div>

</body>
</html>
