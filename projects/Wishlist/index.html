<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header>
    <img src="assets/icons/Vector.svg" alt="Logo Larkef">
    <h1>quicklist</h1>
  </header>

  <main>

    <a href="#"><ion-icon name="arrow-back-outline"></ion-icon> Voltar</a>
    <h2>Compras da semana</h2>
    <div class="submit">
      <input type="text" placeholder="Adicione um novo item">
      <button id="add-item">Adicionar item</button>
    </div>
    <ul>
      <div class="checkbox-list"><input type="checkbox"> <li>Pão de forma</li> <button><img src="assets/icons/delete-small.svg" alt=""></button></div>
      <div class="checkbox-list"><input type="checkbox"> <li>Café preto</li> <button><img src="assets/icons/delete-small.svg" alt=""></button></div>
      <div class="checkbox-list"><input type="checkbox"> <li>Suco de laranja</li> <button><img src="assets/icons/delete-small.svg" alt=""></button></div>
      <div class="checkbox-list"><input type="checkbox"> <li>Bolacha</li> <button><img src="assets/icons/delete-small.svg" alt=""></button></div>
    </ul>

    <span id="alert">
      <p><img src="assets/icons/warning-circle-filled.svg" alt="Exclamação de aviso">O item foi removido da lista</p>
    </span>
  </main>

  <script src="scripts/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
