<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header>
    <img src="assets/icons/Vector.svg" alt="Logo Larkef">
    <h1>quicklist</h1>
  </header>

  <main>
    <a href="#"><- Voltar</a>
    <h2>Compras da semana</h2>
    <input type="text" placeholder="Adicione um novo item">
    <button>Adicionar item</button>
    <ul>
      <input type="checkbox"> <li>Pão de forma</li>
      <input type="checkbox"> <li>Café preto</li>
      <input type="checkbox"> <li>Suco de laranja</li>
      <input type="checkbox"> <li>Bolacha</li>
    </ul>

    <p><img src="assets/icons/warning-circle-filled.svg" alt="Exclamação de aviso">O item foi removido da lista</p>
  </main>

  <script src="scripts/script.js"></script>

</html>
